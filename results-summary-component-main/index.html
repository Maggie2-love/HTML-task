<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result summary component </title>
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <main class="result-container">
 <section class="result">
  <h3>Your Result</h3>
  <div class="score-circle">
    <h1>76</h1>
    <h3>of 100</h3>
 </div>
 <h2>Great</h2>
 <p class="result-description">
You scored higher than 65% of people who have taken these tests.</p>

 </section>
 <section class="summary">
  <h2>Summary</h2>
    <div class="summary-item reaction">
      <span>
        <img src="assets/images/icon-reaction.svg" alt="">Reaction
        </span>
        <p><strong>80</strong>/ 100</p>
      
    </div>
    <div class="summary-item memory">
      <span>
        <img src="assets/images/icon-memory.svg" alt="">Memory
        </span>
<p><strong>92</strong>/ 100</p>
     
    </div>
    <div class="summary-item verbal">
      <span>
        <img src="assets/images/icon-verbal.svg" alt="">Verbal
    </span>
    <p><strong>61</strong>/ 100</p>
    </div>
    <div class="summary-item visual">
      <span>
        <img src="assets/images/icon-visual.svg" alt="">Visual
      </span>
      <p><strong>73</strong>/ 100</p>
    </div>
    <button class="continue-btn">
    continue
    </button>
  

 </section>
  </main>
 



  
</body>
</html>
